<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeri Enam Gambar</title>
  <link rel="stylesheet" href="galeri.css">
</head>
<body>
  <main class="container">
    <h1>Galeri Foto</h1>
    <p class="deskripsi">Contoh galeri enam gambar menggunakan CSS Grid dengan tiga kolom.</p>
    <section class="galeri" aria-label="Galeri enam gambar">
      <figure class="item"><img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=900" alt="Pemandangan pegunungan"><figcaption>Pegunungan</figcaption></figure>
      <figure class="item"><img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=900" alt="Danau dan pegunungan"><figcaption>Danau</figcaption></figure>
      <figure class="item"><img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=900" alt="Hutan hijau"><figcaption>Hutan</figcaption></figure>
      <figure class="item"><img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=900" alt="Pantai dan laut"><figcaption>Pantai</figcaption></figure>
      <figure class="item"><img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=900" alt="Gunung saat malam"><figcaption>Langit Malam</figcaption></figure>
      <figure class="item"><img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=900" alt="Matahari terbit"><figcaption>Matahari Terbit</figcaption></figure>
    </section>
  </main>
</body>
</html>
